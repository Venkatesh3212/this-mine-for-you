<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Mayuri</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde4ea; --ink:#4a1730; --card:#fff7f9; --rose:#e0245e; --rose-dk:#b81a4a; --soft:#f3b8c8; --muted:#8a4f66;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a0f1c; --ink:#ffe3ec; --card:#3a1626; --rose:#ff4d82; --rose-dk:#e0306a; --soft:#6b2a44; --muted:#e2a3b8; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#2a0f1c; --ink:#ffe3ec; --card:#3a1626; --rose:#ff4d82; --rose-dk:#e0306a; --soft:#6b2a44; --muted:#e2a3b8; color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card{background:var(--card);border-radius:28px;padding:34px 26px 38px;width:min(92vw,440px);text-align:center;
  box-shadow:0 18px 50px rgba(224,36,94,.18);position:relative;z-index:2;max-height:94vh;overflow-y:auto}
.emoji{font-size:76px;line-height:1;display:block;margin-bottom:10px}
h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(28px,7.5vw,38px);line-height:1.15;margin:0 0 8px;word-break:break-word}
p.sub{margin:0 0 24px;color:var(--muted);font-weight:600;min-height:1.5em}
.hidden{display:none!important}
input[type=text]{width:100%;font:inherit;font-weight:800;font-size:20px;text-align:center;padding:14px 18px;border-radius:999px;
  border:2px solid var(--soft);background:transparent;color:var(--ink);margin-bottom:16px}
input[type=text]:focus{outline:3px solid var(--rose);border-color:var(--rose)}
button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:999px;padding:14px 32px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.primary{background:var(--rose);color:#fff;box-shadow:0 6px 0 var(--rose-dk)}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rose-dk)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:64px}
#no{background:var(--soft);color:var(--ink);transition:left .25s ease,top .25s ease,transform .25s}
#no.free{position:fixed;z-index:5}
#yes{transition:font-size .15s,padding .15s,transform .15s}
.group{margin:0 0 18px;text-align:left}
.group b{display:block;margin-bottom:8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;color:var(--ink);border:2px solid var(--soft);padding:8px 16px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.summary{background:var(--soft);color:var(--ink);border-radius:18px;padding:14px;font-weight:700;margin:0 0 16px;text-align:left;white-space:pre-line}
a.wa{display:inline-block;text-decoration:none}
.heart{position:fixed;top:100%;z-index:1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}#no{transition:none}}

.bg{position:fixed;inset:0;z-index:0}
.bg i{position:absolute;inset:0;background-size:cover;background-position:center 25%;opacity:0;transition:opacity 1.6s ease,transform 8s ease;transform:scale(1.05)}
.bg i.on{opacity:1;transform:scale(1.12)}
.veil{position:fixed;inset:0;z-index:1;background:linear-gradient(rgba(74,23,48,.35),rgba(74,23,48,.55))}
.card{background:rgba(255,247,249,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{background:rgba(58,22,38,.85)}}
:root[data-theme="dark"] .card{background:rgba(58,22,38,.85)}
@media (prefers-reduced-motion:reduce){.bg i{transition:opacity 1.6s ease;transform:none}.bg i.on{transform:none}}

body.booking .veil{background:linear-gradient(rgba(30,8,20,.62),rgba(30,8,20,.78))}
body.booking .bg{filter:blur(7px)}
.stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s ease}
.stage.out{opacity:0;pointer-events:none}
.book{position:relative;width:min(78vw,320px);aspect-ratio:5/7;perspective:1400px;cursor:pointer;filter:drop-shadow(0 22px 40px rgba(0,0,0,.5))}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,.05,.25,1)}
.leaf.flip{transform:rotateY(-178deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 14px 14px 4px;overflow:hidden}
.face.front{background:#fffaf3;color:#4a1730;padding:16px 16px 18px;display:flex;flex-direction:column;text-align:center;border-left:6px solid #e9d7c7}
.face.back{background:#f6ead9;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;font-size:28px;color:#d9b99b}
.face.front img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:8px;margin-bottom:12px}
.face.front h3{margin:0 0 4px;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:20px;color:#b81a4a}
.face.front p{margin:0;font-weight:700;font-size:15px;line-height:1.35}
.face.cover{background:linear-gradient(145deg,#b81a4a,#7d0f33);color:#ffe9c9;border-left:8px solid #5e0a26;align-items:center;justify-content:center;gap:8px}
.cover small{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;opacity:.85}
.cover h2{margin:0;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:clamp(40px,12vw,54px);font-weight:600}
.cover .orn{font-size:46px;margin:10px 0}
.cover em{font-style:normal;font-weight:800;font-size:14px;animation:pulse 1.6s ease-in-out infinite}
.face.last{justify-content:center;align-items:center;gap:14px}
.face.last p{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:22px;line-height:1.3}
.face.last .primary{font-size:16px;padding:12px 26px}
.hint{color:#ffe3ec;font-weight:700;margin:0;font-size:14px;text-align:center;min-height:1.3em}
@keyframes pulse{50%{opacity:.35}}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card.show{animation:fadeup .8s ease both}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}.card.show{animation:none}.cover em{animation:none}}

.secret{position:absolute;top:24px;right:24px;width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.35);font-size:18px;line-height:34px;box-shadow:none;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.2)}}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,5,12,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.letter{background:#fffaf3;color:#4a1730;border-radius:14px;padding:26px 24px;max-width:340px;width:100%;max-height:86vh;overflow:auto;text-align:center;animation:fadeup .7s ease both;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.letter h3{margin:0 0 12px;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:26px;color:#b81a4a}
.letter p{margin:0 0 18px;white-space:pre-line;font-weight:700;line-height:1.55;text-align:left;font-size:15.5px}
.cdlabel{margin:0 0 8px;font-weight:800;font-size:14px;color:var(--muted)}
.countdown{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.countdown div{background:var(--soft);border-radius:14px;padding:10px 6px;min-width:62px}
.countdown b{display:block;font-size:26px;line-height:1.1}
.countdown span{font-size:12px;font-weight:800;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.secret{animation:none}.letter{animation:none}}

.caltabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid span{font-size:12px;font-weight:800;color:var(--muted);padding:2px 0}
.calgrid button{padding:0;font-size:14px;font-weight:800;aspect-ratio:1;border-radius:50%;background:transparent;color:var(--ink);border:0;box-shadow:none;min-width:0}
.calgrid button:disabled{opacity:.28;cursor:not-allowed}
.calgrid button:not(:disabled):hover{background:var(--soft)}
.calgrid button.sel{background:var(--rose);color:#fff}
.calgrid i{display:block}
.face.front .primary{margin-top:10px;font-size:15px;padding:10px 22px;align-self:center}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="veil"></div>
<div class="stage" id="bookStage"></div>
<main class="card hidden" id="card">
  <span class="emoji" id="emoji">👋</span>
  <h1 id="title">Hi, what’s your name?</h1>
  <p class="sub" id="sub">Type it in. I have something to ask you.</p>

  <!-- Step 1: name -->
  <section id="s1" class="hidden">
    <input type="text" id="name" placeholder="Your name" maxlength="30" autocomplete="given-name" aria-label="Your name">
    <button class="primary" id="go" disabled>Continue</button>
  </section>

  <!-- Step 2: the question -->
  <section id="s2" class="hidden">
    <div class="btns" id="btns">
      <button class="primary" id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </section>

  <!-- Step 3: plan -->
  <section id="s3" class="hidden">
    <div class="group"><b>What sounds good?</b><div class="chips" data-key="what"></div></div>
    <div class="group"><b>Which day? (pick a date)</b><div id="cal"></div></div>
    <div class="group"><b>What time?</b><div class="chips" data-key="time"></div></div>
    <button class="primary" id="plan" disabled>Lock it in</button>
  </section>

  <!-- Step 4: summary -->
  <section id="s4" class="hidden">
    <div class="summary" id="summary"></div>
    <p class="cdlabel">Counting down to our date ⏳</p>
    <div class="countdown" id="cd"></div>
    <a class="wa" id="wa" target="_blank" rel="noopener"><button class="primary" type="button">Send me the plan</button></a>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var nameIn=$('name'), go=$('go'), yes=$('yes'), no=$('no');
  var title=$('title'), sub=$('sub'), emoji=$('emoji');
  var name='', tries=0, finished=false, choice={what:'',day:'',time:''};

  var opts={
    what:['Coffee ☕','Dinner 🍝','Movie 🎬','Long walk 🌳','Ice cream 🍦'],
    day:['This weekend','Next weekend','Friday','Saturday','Sunday'],
    time:['Morning','Afternoon','Evening','Night']
  };
  var lines=["Are you sure, NAME? 🥹","Wrong button!","Try the other one 😏","Nope, can’t click that.","The Yes button misses you.","Still no? Really?","Okay, that No button is broken."];
  var faces=["🥺","😢","😭","🥹","😤","🙈","😏"];

  function show(id){['s1','s2','s3','s4'].forEach(function(s){$(s).classList.toggle('hidden',s!==id)})}
  function clean(s){return s.replace(/\s+/g,' ').trim()}

  // Realtime: heading follows what she types
  nameIn.addEventListener('input',function(){
    name=clean(nameIn.value);
    title.textContent=name?('Hi '+name+' 😊'):'Hi, what’s your name?';
    go.disabled=!name;
  });
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter'&&name)start()});
  go.addEventListener('click',start);

  function start(){
    if(!name) return;
    emoji.textContent='🥺';
    title.textContent='Will you go out with me, '+name+'?';
    sub.textContent='I promise good company and bad jokes.';
    show('s2');
  }

  // Dodging No
  function nearYes(x,y,w,h){var r=yes.getBoundingClientRect();return x<r.right+20&&x+w>r.left-20&&y<r.bottom+20&&y+h>r.top-20}
  function dodge(e){
    if(finished) return;
    if(e&&e.preventDefault) e.preventDefault();
    tries++;
    no.classList.add('free');
    var w=no.offsetWidth,h=no.offsetHeight,pad=12,t=0,x,y;
    do{
      x=pad+Math.random()*Math.max(innerWidth-w-pad*2,0);
      y=pad+Math.random()*Math.max(innerHeight-h-pad*2,0);
      t++;
    }while(t<20&&nearYes(x,y,w,h));
    no.style.left=x+'px';no.style.top=y+'px';
    sub.textContent=lines[(tries-1)%lines.length].replace('NAME',name);
    emoji.textContent=faces[(tries-1)%faces.length];
    var s=Math.min(1+tries*0.12,2);
    yes.style.fontSize=(18*s)+'px';
    yes.style.padding=(14*s)+'px '+(32*s)+'px';
    if(tries>4) no.style.transform='scale('+Math.max(1-(tries-4)*0.12,0.4)+')';
  }
  ['mouseenter','pointerdown','touchstart','click','focus'].forEach(function(ev){no.addEventListener(ev,dodge,{passive:false})});
  document.addEventListener('mousemove',function(e){
    if(finished||$('card').classList.contains('hidden')||$('s2').classList.contains('hidden')) return;
    var r=no.getBoundingClientRect();
    if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<90) dodge();
  });

  // Yes
  yes.addEventListener('click',function(){
    finished=true;
    no.style.display='none';
    emoji.textContent='🥰';
    title.textContent='Yay, '+name+'! 🎉';
    sub.textContent='Now let’s plan it. Pick what you like.';
    show('s3');
    for(var i=0;i<50;i++) setTimeout(heart,i*70);
  });


  // Calendar: current month + next two (Nov, Dec, Jan right now)
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var WD=['Mo','Tu','We','Th','Fr','Sa','Su'];
  var calEl=$('cal'), mi=0, today0=new Date();
  function renderCal(){
    var tom=new Date(); tom.setHours(0,0,0,0); tom.setDate(tom.getDate()+1);
    calEl.textContent='';
    var tabs=document.createElement('div'); tabs.className='caltabs';
    for(var k=0;k<3;k++){(function(k){
      var m=new Date(today0.getFullYear(),today0.getMonth()+k,1);
      var b=document.createElement('button'); b.type='button'; b.className='chip';
      b.textContent=MN[m.getMonth()].slice(0,3)+' '+m.getFullYear();
      b.setAttribute('aria-pressed',String(k===mi));
      b.addEventListener('click',function(){mi=k;renderCal()});
      tabs.appendChild(b);
    })(k)}
    calEl.appendChild(tabs);
    var first=new Date(today0.getFullYear(),today0.getMonth()+mi,1);
    var dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    var grid=document.createElement('div'); grid.className='calgrid';
    WD.forEach(function(w){var sp=document.createElement('span');sp.textContent=w;grid.appendChild(sp)});
    for(var e=0;e<(first.getDay()+6)%7;e++){grid.appendChild(document.createElement('i'))}
    for(var d=1;d<=dim;d++){(function(d){
      var dt=new Date(first.getFullYear(),first.getMonth(),d);
      var b=document.createElement('button'); b.type='button'; b.textContent=d;
      b.disabled=dt<tom;
      if(choice.date&&choice.date.getTime()===dt.getTime()) b.className='sel';
      b.addEventListener('click',function(){
        choice.date=dt;
        choice.day=dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
        $('plan').disabled=!(choice.what&&choice.day&&choice.time);
        renderCal();
      });
      grid.appendChild(b);
    })(d)}
    calEl.appendChild(grid);
  }
  renderCal();

  // Plan chips
  document.querySelectorAll('.chips').forEach(function(box){
    var key=box.getAttribute('data-key');
    opts[key].forEach(function(label){
      var b=document.createElement('button');
      b.type='button';b.className='chip';b.textContent=label;b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){
        box.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed','false')});
        b.setAttribute('aria-pressed','true');
        choice[key]=label;
        $('plan').disabled=!(choice.what&&choice.day&&choice.time);
      });
      box.appendChild(b);
    });
  });

  $('plan').addEventListener('click',function(){
    var text='Date plan for '+name+':\n'+choice.what+'\n'+choice.day+', '+choice.time;
    $('summary').textContent=text;
    var T={'Morning':10,'Afternoon':15,'Evening':19,'Night':21};
    var now=new Date(), hr=T[choice.time]||18;
    var target=new Date(choice.date.getFullYear(),choice.date.getMonth(),choice.date.getDate(),hr,0,0);
    var dateStr=target.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    $('summary').textContent='Date plan for '+name+':\n'+choice.what+'\n'+dateStr+', '+choice.time;
    var cdEl=$('cd');
    function tick(){
      var ms=target-new Date();
      if(ms<=0){cdEl.textContent='It\u2019s date time! \uD83D\uDC96';return}
      var u=[[Math.floor(ms/864e5),'days'],[Math.floor(ms/36e5)%24,'hours'],[Math.floor(ms/6e4)%60,'mins'],[Math.floor(ms/1e3)%60,'secs']];
      cdEl.innerHTML=u.map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('');
    }
    tick(); setInterval(tick,1000);
    var msg='Hi! I\u2019m '+name+'. I said YES \uD83D\uDC96\n'+choice.what+' on '+dateStr+' ('+choice.time+'). It\u2019s a date!';
    $('wa').href='https://wa.me/918978010439?text='+encodeURIComponent(msg);
    title.textContent='It’s a date! 💖';
    sub.textContent='See you soon, '+name+'.';
    emoji.textContent='💑';
    show('s4');
  });

  function heart(){
    var h=document.createElement('div');
    h.className='heart';
    h.textContent=['💖','💗','💕','❤️','💘'][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(18+Math.random()*28)+'px';
    h.style.animationDuration=(3+Math.random()*3)+'s';
    document.body.appendChild(h);
    setTimeout(function(){h.remove()},6500);
  }

  var bg=document.getElementById('bg'), layers=IMGS.map(function(u){var d=document.createElement('i');d.style.backgroundImage='url('+u+')';bg.appendChild(d);return d});
  var cur=0; layers[0].classList.add('on');

  // ---- Story book intro ----
  var CAPS=[
    ['Chapter 1','The girl who made even a lake look prettier.'],
    ['Chapter 2','A smile I keep thinking about.'],
    ['Chapter 3','Some moments make winter feel warm.'],
    ['Chapter 4','And then I got curious about you\u2026']
  ];
  var stage=document.getElementById('bookStage');
  document.body.classList.add('booking');
  var book=document.createElement('div'); book.className='book';
  var leaves=[], idx=0;
  function mkLeaf(cls){
    var l=document.createElement('div'); l.className='leaf';
    var f=document.createElement('div'); f.className='face front '+(cls||'');
    var b=document.createElement('div'); b.className='face back'; b.textContent='\u2726';
    l.appendChild(f); l.appendChild(b); book.appendChild(l); leaves.push(l); return f;
  }

  var LETTER="Dear Mayuri,\n\nI\u2019ve been wanting to tell you something for a while.\n\nYour smile makes my ordinary days brighter, and I keep finding reasons to think about you.\n\nI\u2019m not great with big speeches, so I made you a little book instead.\n\nWhatever you answer, I\u2019m really glad I know you.\n\n\u2014 Someone who\u2019s very curious about you \uD83D\uDC8C";
  function openLetter(){
    var m=document.createElement('div'); m.className='modal';
    var c=document.createElement('div'); c.className='letter';
    var h=document.createElement('h3'); h.textContent='\uD83D\uDC8C A secret letter';
    var t=document.createElement('p'); t.textContent=LETTER;
    var x=document.createElement('button'); x.type='button'; x.className='primary'; x.textContent='Close';
    x.addEventListener('click',function(){m.remove(); hint.textContent='You found the secret \uD83D\uDC8C'});
    c.appendChild(h); c.appendChild(t); c.appendChild(x); m.appendChild(c); document.body.appendChild(m);
  }
  var cv=mkLeaf('cover');
  cv.innerHTML='<small>A little story for</small><h2>Mayuri</h2><div class="orn">\uD83D\uDCD6</div><em>Tap to open</em>';

    var f=mkLeaf('');
    var im=document.createElement('img'); im.alt=''; im.src=IMGS[i%IMGS.length]; f.appendChild(im);
    var h=document.createElement('h3'); h.textContent=c[0]; f.appendChild(h);
    var pp=document.createElement('p'); pp.textContent=c[1]; f.appendChild(pp);
    if(i===2){
      var sb=document.createElement('button'); sb.type='button'; sb.className='secret'; sb.setAttribute('aria-label','Secret'); sb.textContent='\uD83D\uDC97';

  var turn=document.createElement('button'); turn.className='primary'; turn.type='button'; turn.textContent='Turn the page'; lf.appendChild(turn);

  var hints=['','Keep turning\u2026','Look closely at the next page \uD83D\uDC40','Did you spot something tiny?','One more\u2026',''];

  function flip(i){
    var l=leaves[i]; l.classList.add('flip');
    setTimeout(function(){l.style.visibility='hidden'},1050);
  }
  book.addEventListener('click',function(){
    if(idx>=leaves.length-1) return;
    flip(idx); idx++;
    hint.textContent=hints[idx]||'';

  function finish(){
    flip(idx);

  hint.textContent='';
  name='Mayuri'; start();
